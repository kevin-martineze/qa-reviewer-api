# Cada push a main: gates, imagen arm64 en GHCR y deploy a la instancia EC2 por SSM.
# Variables del repo (Settings → Secrets and variables → Actions → Variables):
#   AWS_DEPLOY_ROLE_ARN  rol OIDC qa-reviewer-deploy (solo ssm:SendCommand a la instancia)
#   EC2_INSTANCE_ID      instancia del API
#   API_HOST             host público (Caddy saca el certificado)
#   PUBLIC_WEB_URL · S3_BUCKET · BACKUP_BUCKET  para el .env del primer deploy
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/kevin-martineze/qa-reviewer-api

jobs:
  gates:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build

  image:
    needs: gates
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
      - name: Desplegar por SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          TAG: ${{ env.IMAGE }}:${{ github.sha }}
          API_HOST: ${{ vars.API_HOST }}
          PUBLIC_WEB_URL: ${{ vars.PUBLIC_WEB_URL }}
          S3_BUCKET: ${{ vars.S3_BUCKET }}
          BACKUP_BUCKET: ${{ vars.BACKUP_BUCKET }}
        run: |
          b64() { base64 -w0 "$1"; }
          dir=/opt/qa-reviewer
          # .env del primer deploy, sin secretos: la instancia lo usa solo si no tiene uno.
          printf '%s\n' \
            "API_HOST=$API_HOST" \
            "PUBLIC_WEB_URL=$PUBLIC_WEB_URL" \
            "STORAGE_DRIVER=s3" \
            "S3_BUCKET=$S3_BUCKET" \
            "S3_REGION=us-east-1" \
            "BACKUP_BUCKET=$BACKUP_BUCKET" \
            "MAIL_DRIVER=log" > env.defaults
          # AWS-RunShellScript corre con sh: sin pipefail aquí; el script remoto usa bash.
          params=$(jq -n \
            --arg compose "$(b64 deploy/docker-compose.prod.yml)" \
            --arg caddy "$(b64 deploy/Caddyfile)" \
            --arg backup "$(b64 deploy/backup.sh)" \
            --arg remote "$(b64 deploy/remote-deploy.sh)" \
            --arg envdefaults "$(b64 env.defaults)" \
            --arg dir "$dir" --arg tag "$TAG" \
            '{commands: [
              "set -eu",
              "mkdir -p \($dir)/incoming",
              "echo \($compose) | base64 -d > \($dir)/incoming/docker-compose.prod.yml",
              "echo \($caddy) | base64 -d > \($dir)/incoming/Caddyfile",
              "echo \($backup) | base64 -d > \($dir)/incoming/backup.sh",
              "echo \($envdefaults) | base64 -d > \($dir)/incoming/env.defaults",
              "echo \($remote) | base64 -d > \($dir)/remote-deploy.sh",
              "bash \($dir)/remote-deploy.sh \($tag)"
            ], executionTimeout: ["900"]}')
          id=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "qa-reviewer-api ${GITHUB_SHA::7}" \
            --parameters "$params" \
            --query Command.CommandId --output text)
          echo "SSM command $id"
          for _ in $(seq 1 120); do
            sleep 5
            status=$(aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
              --query Status --output text 2>/dev/null || echo Pending)
            case "$status" in
              Pending|InProgress|Delayed) continue ;;
              *) break ;;
            esac
          done
          aws ssm get-command-invocation --command-id "$id" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent, StandardErrorContent]' --output text
          echo "Estado: $status"
          test "$status" = Success
      - name: Readiness desde fuera (HTTPS)
        env:
          API_HOST: ${{ vars.API_HOST }}
        run: |
          curl -fsS --retry 20 --retry-all-errors --retry-delay 3 \
            "https://$API_HOST/healthcheck/readiness-probe"
